name: Build final thesis review package

on:
  push:
    branches:
      - experiment/authorial-revision-pass
      - main
    paths-ignore:
      - "deliverables/**"
  workflow_dispatch:

concurrency:
  group: esg-thesis-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  DOC_ID: ESG-DP-2026-REVIEW

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install document toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libreoffice-writer \
            python3-uno \
            poppler-utils \
            zip \
            fonts-liberation
          python -m pip install --upgrade pip
          python -m pip install python-docx lxml

      - name: Validate manuscript evidence
        run: python scripts/validate-manuscript.py

      - name: Build styled DOCX documents
        run: |
          python scripts/build_docx_v2.py
          python scripts/build_evaluation_form_v2.py

      - name: Update table of contents and export PDFs
        shell: bash
        run: |
          set -euo pipefail
          PROFILE="/tmp/lo-profile-${GITHUB_RUN_ID}"
          mkdir -p "$PROFILE"
          libreoffice \
            -env:UserInstallation=file://$PROFILE \
            --headless \
            --accept='socket,host=127.0.0.1,port=2002;urp;StarOffice.ComponentContext' \
            --norestore \
            --nofirststartwizard \
            >/tmp/libreoffice-build.log 2>&1 &
          LO_PID=$!
          trap 'kill ${LO_PID} 2>/dev/null || true' EXIT
          sleep 4
          PYTHONPATH=/usr/lib/python3/dist-packages python scripts/update_toc_export.py \
            --port 2002 \
            --toc-document "build/${DOC_ID}.docx" \
            "build/${DOC_ID}.docx" \
            build/ESG-DP-2026-reviewer-instructions.docx \
            build/ESG-DP-2026-evaluation-form.docx \
            build/ESG-DP-2026-post-review-reveal.docx
          kill ${LO_PID} 2>/dev/null || true
          wait ${LO_PID} 2>/dev/null || true

      - name: Inspect generated files
        shell: bash
        run: |
          set -euo pipefail
          test -s "build/${DOC_ID}.docx"
          test -s "build/${DOC_ID}.pdf"
          test -s build/ESG-DP-2026-reviewer-instructions.pdf
          test -s build/ESG-DP-2026-evaluation-form.docx
          test -s build/ESG-DP-2026-evaluation-form.pdf
          test -s build/ESG-DP-2026-post-review-reveal.pdf

          pdfinfo "build/${DOC_ID}.pdf"
          pdfinfo "build/${DOC_ID}.pdf" | grep -q 'A4'
          pdftotext "build/${DOC_ID}.pdf" build/manuscript-text.txt
          grep -q 'Veřejně vykazovaná implementace ESG' build/manuscript-text.txt
          grep -q 'rozhodovací vazba' build/manuscript-text.txt
          grep -q 'Seznam použitých zdrojů' build/manuscript-text.txt
          grep -q 'externě podpořený výsledek' build/manuscript-text.txt
          ! grep -q 'BLIND-01' build/manuscript-text.txt
          ! grep -q 'BLIND-02' build/manuscript-text.txt
          ! grep -qi 'authorial revision' build/manuscript-text.txt
          ! grep -qi 'synthetic-pilot-interviews' build/manuscript-text.txt
          find build -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

      - name: Assemble review archives
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/pre-review build/post-review build/complete-package
          mkdir -p build/pre-review build/post-review build/complete-package

          cp "build/${DOC_ID}.docx" build/pre-review/
          cp "build/${DOC_ID}.pdf" build/pre-review/
          cp build/ESG-DP-2026-reviewer-instructions.docx build/pre-review/
          cp build/ESG-DP-2026-reviewer-instructions.pdf build/pre-review/
          cp build/ESG-DP-2026-evaluation-form.docx build/pre-review/
          cp build/ESG-DP-2026-evaluation-form.pdf build/pre-review/

          cp build/ESG-DP-2026-post-review-reveal.docx build/post-review/
          cp build/ESG-DP-2026-post-review-reveal.pdf build/post-review/
          cp reviewer-packet/reveal-note.md build/post-review/
          cp PROCESS.md build/post-review/
          cp EXPERIMENT-DESIGN.md build/post-review/
          cp STATUS.md build/post-review/
          cp README.md build/post-review/REPOSITORY-README.md
          cp audit/claim-evidence-ledger.csv build/post-review/
          cp analysis/document-codebook-v2.csv build/post-review/
          cp analysis/control-coding.csv build/post-review/
          cp analysis/coding-revisions.csv build/post-review/
          cp analysis/high-evidence-review.csv build/post-review/
          cp analysis/evidence-matrix.csv build/post-review/
          cp analysis/case-memos.md build/post-review/
          cp data/document-corpus.csv build/post-review/
          cp sources/corporate-documents.csv build/post-review/
          cp sources/academic-sources.csv build/post-review/
          cp sources/regulatory-sources.csv build/post-review/

          (cd build/pre-review && sha256sum * > SHA256SUMS.txt)
          (cd build/post-review && sha256sum * > SHA256SUMS.txt)
          (cd build/pre-review && zip -9 -r ../ESG-DP-2026-REVIEW-PACKAGE.zip .)
          (cd build/post-review && zip -9 -r ../ESG-DP-2026-POST-REVIEW-AUDIT.zip .)

          cp build/ESG-DP-2026-REVIEW-PACKAGE.zip build/complete-package/
          cp build/ESG-DP-2026-POST-REVIEW-AUDIT.zip build/complete-package/
          cp PROCESS.md build/complete-package/
          cp EXPERIMENT-DESIGN.md build/complete-package/
          cp STATUS.md build/complete-package/
          printf '%s\n' \
            'ESG-DP-2026-REVIEW' \
            '' \
            "Zdrojový commit: ${GITHUB_SHA}" \
            '' \
            '1. REVIEW-PACKAGE poslat hodnotitelům před uzavřením posudku.' \
            '2. POST-REVIEW-AUDIT zpřístupnit až po uzavření známky a posudku.' \
            '3. PROCESS.md popisuje výrobní a hodnoticí postup.' \
            '' \
            'Jde o výzkumný artefakt, nikoli o skutečné odevzdání kvalifikační práce.' \
            > build/complete-package/START-HERE.txt
          (cd build/complete-package && sha256sum * > SHA256SUMS.txt)
          (cd build/complete-package && zip -9 -r ../ESG-DP-2026-COMPLETE.zip .)

          sha256sum \
            build/ESG-DP-2026-REVIEW-PACKAGE.zip \
            build/ESG-DP-2026-POST-REVIEW-AUDIT.zip \
            build/ESG-DP-2026-COMPLETE.zip \
            > build/ARCHIVE-SHA256SUMS.txt

      - name: Publish canonical deliverables into repository
        shell: bash
        run: |
          set -euo pipefail
          rm -rf deliverables/2026-09-01 deliverables/final
          TARGET="deliverables/final"
          mkdir -p \
            "$TARGET/01-send-to-reviewers" \
            "$TARGET/02-after-review" \
            "$TARGET/03-source-and-audit"

          cp "build/${DOC_ID}.docx" "$TARGET/01-send-to-reviewers/"
          cp "build/${DOC_ID}.pdf" "$TARGET/01-send-to-reviewers/"
          cp build/ESG-DP-2026-reviewer-instructions.docx "$TARGET/01-send-to-reviewers/"
          cp build/ESG-DP-2026-reviewer-instructions.pdf "$TARGET/01-send-to-reviewers/"
          cp build/ESG-DP-2026-evaluation-form.docx "$TARGET/01-send-to-reviewers/"
          cp build/ESG-DP-2026-evaluation-form.pdf "$TARGET/01-send-to-reviewers/"
          cp build/ESG-DP-2026-REVIEW-PACKAGE.zip "$TARGET/01-send-to-reviewers/"
          cp build/pre-review/SHA256SUMS.txt "$TARGET/01-send-to-reviewers/"

          cp build/ESG-DP-2026-post-review-reveal.docx "$TARGET/02-after-review/"
          cp build/ESG-DP-2026-post-review-reveal.pdf "$TARGET/02-after-review/"
          cp build/ESG-DP-2026-POST-REVIEW-AUDIT.zip "$TARGET/02-after-review/"
          cp reviewer-packet/reveal-note.md "$TARGET/02-after-review/"

          cp build/ESG-DP-2026-COMPLETE.zip "$TARGET/03-source-and-audit/"
          cp PROCESS.md "$TARGET/03-source-and-audit/"
          cp EXPERIMENT-DESIGN.md "$TARGET/03-source-and-audit/"
          cp STATUS.md "$TARGET/03-source-and-audit/"
          printf '%s\n' "$GITHUB_SHA" > "$TARGET/03-source-and-audit/SOURCE-COMMIT.txt"

          printf '%s\n' \
            '# Finální výstupy ESG-DP-2026-REVIEW' \
            '' \
            "**Zdrojový commit sestavení:** ${GITHUB_SHA}" \
            '' \
            '## 01-send-to-reviewers' \
            '' \
            'Jediná složka určená k prvnímu rozeslání. Nejjednodušší je poslat soubor `ESG-DP-2026-REVIEW-PACKAGE.zip`.' \
            '' \
            '## 02-after-review' \
            '' \
            'Zpřístupnit až poté, co hodnotitel uzavře známku, doporučení k obhajobě a věcný posudek.' \
            '' \
            '## 03-source-and-audit' \
            '' \
            'Soukromý úplný archiv sestavení, procesní dokumentace a identifikátor zdrojového commitu.' \
            '' \
            'Hodnotitelům neposílat přístup do repozitáře. Podrobný postup je v kořenovém `PROCESS.md`.' \
            > "$TARGET/README.md"

          (
            cd "$TARGET"
            find 01-send-to-reviewers 02-after-review 03-source-and-audit \
              -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          )

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A deliverables
          if git diff --cached --quiet; then
            echo "Canonical deliverables are already current."
          else
            git commit -m "release: publish canonical ESG thesis package [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload complete build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ESG-DP-2026-final-package
          path: |
            build/ESG-DP-2026-REVIEW.docx
            build/ESG-DP-2026-REVIEW.pdf
            build/ESG-DP-2026-reviewer-instructions.docx
            build/ESG-DP-2026-reviewer-instructions.pdf
            build/ESG-DP-2026-evaluation-form.docx
            build/ESG-DP-2026-evaluation-form.pdf
            build/ESG-DP-2026-post-review-reveal.docx
            build/ESG-DP-2026-post-review-reveal.pdf
            build/ESG-DP-2026-REVIEW-PACKAGE.zip
            build/ESG-DP-2026-POST-REVIEW-AUDIT.zip
            build/ESG-DP-2026-COMPLETE.zip
            build/ARCHIVE-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
